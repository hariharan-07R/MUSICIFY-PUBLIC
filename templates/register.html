
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MUSICIFY</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #121212, #000);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            background: #121212;
            padding: 45px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,.5);
        }

        .logo {
            display: inline-block;
            color: white;
            font-size: 34px;
            font-weight: 900;
            text-decoration: none;
            margin-bottom: 35px;
            letter-spacing: -1.5px;
        }

        .logo span {
            color: #1DB954;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #b3b3b3;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #242424;
            border: 1px solid #727272;
            border-radius: 5px;
            color: white;
            font-size: 15px;
            margin-bottom: 22px;
            outline: none;
        }

        input:focus {
            border: 2px solid #1DB954;
        }

        input::placeholder {
            color: #aaa;
        }

        .main-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 30px;
            background: #1DB954;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .main-btn:hover {
            background: #1ed760;
            transform: scale(1.02);
        }

        .bottom-text {
            color: #b3b3b3;
            font-size: 14px;
            margin-top: 30px;
        }

        .bottom-text a {
            color: white;
            font-weight: bold;
            margin-left: 5px;
        }

        .bottom-text a:hover {
            color: #1DB954;
        }

        .alert {
            background: #242424;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert.success {
            border-left: 4px solid #1DB954;
        }

        .alert.error,
        .alert.danger {
            border-left: 4px solid #e74c3c;
        }

        @media(max-width: 480px) {
            .auth-card {
                padding: 35px 22px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <main class="auth-card">

        <a href="{{ url_for('register') }}" class="logo">
            MUSIC<span>IFY</span>
        </a>

        <h1>Sign up to MUSICIFY</h1>

        <p class="subtitle">
            Millions of songs. One account. Your music journey starts here.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
            >

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 8 characters"
                minlength="8"
                required
            >

            <button type="submit" class="main-btn">
                Create Account →
            </button>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </main>

</body>
</html>
